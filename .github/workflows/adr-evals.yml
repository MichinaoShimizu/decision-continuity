name: ADR evals

on:
  pull_request:
    paths:
      - 'adr/evals/**'
      - '.github/workflows/adr-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-agent-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test runner with a fake agent (not a live model)
        run: python3 -I -m unittest discover -s adr/evals -p 'test_agent_eval.py' -v
