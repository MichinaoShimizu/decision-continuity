name: records
# 決定の記録（records/）の PR で、ファイル名・番号の重なり・追記だけで育っているかを確かめる。

on:
  pull_request:
    paths:
      - 'records/**'
      - '.claude/skills/decision-record/records.py'
      - '.github/workflows/records.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check records are append-only and numbered uniquely
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I .claude/skills/decision-record/records.py check --base "origin/$BASE_REF"
