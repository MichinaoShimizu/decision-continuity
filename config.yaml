# decision-record スキルの設定。手順は .claude/skills/decision-record/SKILL.md。
store: github-discussions     # このリポジトリの Discussions（Decisions / Decision flows / Q&A）
roles:                        # decided_by / approved_by の role に使うキー。表記ゆれを防ぐため、ここから選ぶ
  cto: CTO
  vpoe: VPoE
  exec_meeting: 経営会議
  bucho_kai: 部長会
  table: 部署横断の意思決定テーブル
  org_head: 組織長（部長など）
  em: EM
  tl: チームリード
  architect: アーキテクト
  security_lead: セキュリティ責任者
  qa_lead: QA責任者
  other: その他（org に書く）
capture_sources:
  allowed: []                 # 拾ってよいチャンネル。未定（決まるまでは渡されたものだけ扱う）
  never: ["DM", "人事のチャンネル"]
restricted_store: null        # 人事に関わる判断を手で残す場所。未定。このリポジトリには置かない
